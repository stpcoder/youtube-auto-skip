<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>v2.6.1 끊김 안내만 숨기기 검증</title>
<link rel="stylesheet" href="../interruption-notice.css">
<style>
  body { font: 16px system-ui; margin: 32px; background: #f6f8fa; }
  li { margin: 10px 0; } .pass { color: #126d39; } .fail { color: #b42318; }
  yt-notification-action-renderer, ytd-notification-action-renderer,
  ytm-notification-action-renderer { display: block; margin: 12px 0; }
  tp-yt-paper-toast { display: block; background: #222; color: white; padding: 16px; }
</style>
<h1>v2.6.1 — 끊김 안내만 숨기기</h1>
<p>실제 DOM·CSS 검사입니다. 서버 대기 해소나 iPhone 재생 검사가 아닙니다.</p>
<p id="status">검사 중…</p>
<ol id="results"></ol>
<div id="notifications">
  <yt-notification-action-renderer id="initial">
    <tp-yt-paper-toast style="display: block !important">
      <yt-formatted-string id="text">동영상 끊김 현상이 발생하나요?</yt-formatted-string>
      <button>이유 알아보기</button>
    </tp-yt-paper-toast>
  </yt-notification-action-renderer>
</div>
<p id="comment">댓글·자막의 같은 문구는 유지: 동영상 끊김 현상이 발생하나요?</p>
<video id="video" muted controls></video>
<script>window.originalVideoPlay = HTMLMediaElement.prototype.play; window.originalVideoPause = HTMLMediaElement.prototype.pause;</script>
<script src="../interruption-notice.js"></script>
<script>
(async () => {
  const results = [], marker = "data-youtube-auto-skip-interruption";
  const area = document.getElementById("notifications");
  const initial = document.getElementById("initial");
  const flush = async () => { await Promise.resolve(); await Promise.resolve(); };
  const visible = n => n.getClientRects().length > 0 && getComputedStyle(n).display !== "none";
  const expect = (condition, message) => { if (!condition) throw Error(message); };
  const stats = () => JSON.parse(document.documentElement.dataset.youtubeAutoSkipNoticeStatus);
  const create = (text, tag = "yt-notification-action-renderer") => {
    const n = document.createElement(tag), toast = document.createElement("tp-yt-paper-toast");
    const label = document.createElement("yt-formatted-string"); label.id = "text"; label.textContent = text;
    const button = document.createElement("button"); button.textContent = "이유 알아보기";
    toast.append(label, button); n.append(toast); return n;
  };
  const run = async (name, fn) => {
    let error = ""; try { await fn(); } catch (e) { error = e.message; }
    results.push({ name, passed: !error, error });
    const li = document.createElement("li"); li.className = error ? "fail" : "pass";
    li.textContent = `${error ? "FAIL" : "PASS"} ${name}${error ? ` — ${error}` : ""}`;
    document.getElementById("results").append(li);
  };
  await run("기존 끊김 안내와 안내 버튼만 숨김", async () => {
    await flush(); expect(!visible(initial) && !visible(initial.querySelector("button")), "안내가 보임");
  });
  await run("다른 재생 오류 안내는 보임", async () => {
    const n = create("동영상을 재생할 수 없습니다."); area.append(n); await flush();
    expect(visible(n), "다른 오류를 숨김"); n.remove();
  });
  await run("재사용한 알림은 다른 문구로 바뀌면 즉시 복원", async () => {
    initial.querySelector("#text").textContent = "네트워크 연결을 확인하세요."; await flush();
    expect(visible(initial) && !initial.hasAttribute(marker), "재사용한 알림이 계속 숨겨짐");
  });
  await run("기존 알림에 끊김 문구가 다시 들어오면 다시 숨김", async () => {
    initial.querySelector("#text").textContent = "동영상 끊김 현상이 발생하나요?"; await flush();
    expect(!visible(initial), "끊김 알림이 다시 보임");
  });
  await run("문자 노드 자체 수정도 감지", async () => {
    const n = create("저장됨"); area.append(n); await flush();
    n.querySelector("#text").firstChild.data = "동영상 끊김 현상이 발생하나요?"; await flush();
    expect(!visible(n), "문자 노드 변경 누락"); n.remove();
  });
  await run("늦게 생성되는 SPA 알림 컨테이너 감지", async () => {
    const container = document.createElement("ytd-popup-container");
    const n = create("Experiencing interruptions?"); container.append(n); area.append(container); await flush();
    expect(!visible(n) && visible(container), "전체 컨테이너를 숨기거나 안내를 놓침"); container.remove();
  });
  await run("다른 문구와 같이 뜨면 끊김 안내만 숨김", async () => {
    const a = create("동영상 끊김 현상이 발생하나요?"), b = create("재생목록에 저장했습니다.");
    area.append(a, b); await flush(); expect(!visible(a) && visible(b), "다른 안내까지 숨김"); a.remove(); b.remove();
  });
  await run("안내 버튼의 텍스트만 같을 때는 숨기지 않음", async () => {
    const n = create("다른 안내"); n.querySelector("button").textContent = "동영상 끊김 현상이 발생하나요?";
    area.append(n); await flush(); expect(visible(n), "버튼 텍스트로 오탐"); n.remove();
  });
  await run("댓글·자막의 같은 문구는 보임", () => {
    expect(visible(document.getElementById("comment")), "댓글을 숨김");
  });
  await run("문구 없는 새 레이아웃은 보존", async () => {
    initial.querySelector("#text").remove(); await flush(); expect(visible(initial), "알 수 없는 알림을 숨김");
  });
  await run("중복 실행은 추가 관찰자·숨김 횟수를 만들지 않음", async () => {
    const before = stats().hiddenMatches;
    const code = await (await fetch("../interruption-notice.js")).text(); new Function(code)(); await flush();
    expect(stats().hiddenMatches === before, "중복 실행으로 횟수 증가");
  });
  await run("재생·일시정지 API와 미디어 상태를 변경하지 않음", () => {
    const video = document.getElementById("video");
    expect(HTMLMediaElement.prototype.play === originalVideoPlay && HTMLMediaElement.prototype.pause === originalVideoPause &&
      video.currentTime === 0 && video.readyState === 0 && video.paused, "미디어 상태 변경");
  });
  initial.remove();
  const shown = create("이 안내는 유지됩니다: 다른 오류·저장 알림은 숨기지 않습니다."); area.append(shown);
  window.fixtureResults = results;
  document.getElementById("status").textContent = `${results.filter(r => r.passed).length}/${results.length} 통과`;
})();
</script>
</html>
